<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>For You</title>

<!-- iOS home screen / PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="For You">
<meta name="theme-color" content="#1a0a12">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body {
    height:100%;
    overflow:hidden;
    background:#1a0a12;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    color:#fff;
    -webkit-font-smoothing:antialiased;
    -webkit-user-select:none; user-select:none;
  }

  body {
    background:
      radial-gradient(120% 80% at 50% 15%, #4a1030 0%, #2a0a1c 45%, #12060d 100%);
    display:flex; align-items:center; justify-content:center;
    padding:calc(env(safe-area-inset-top) + 24px) 28px calc(env(safe-area-inset-bottom) + 24px);
  }

  /* soft drifting glow behind everything */
  .glow {
    position:fixed; top:50%; left:50%;
    width:120vw; height:120vw;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,60,120,.16) 0%, rgba(255,60,120,0) 62%);
    pointer-events:none;
    animation:breathe 7s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { opacity:.65; transform:translate(-50%,-50%) scale(1); }
    50%     { opacity:1;   transform:translate(-50%,-50%) scale(1.12); }
  }

  #stage { position:relative; width:100%; max-width:520px; display:flex; align-items:center; justify-content:center; }

  /* ---------- HEART SCREEN ---------- */
  #heartScreen {
    display:flex; flex-direction:column; align-items:center; gap:34px;
    cursor:pointer;
  }
  #heartScreen.gone { pointer-events:none; }

  .heart-wrap {
    animation:float 4s ease-in-out infinite;
    transform-origin:center;
    will-change:transform;
  }
  @keyframes float {
    0%,100% { transform:translateY(0); }
    50%     { transform:translateY(-12px); }
  }

  #heart {
    width:min(46vw, 190px); height:auto;
    display:block;
    filter:drop-shadow(0 0 34px rgba(255,45,105,.55)) drop-shadow(0 10px 26px rgba(0,0,0,.4));
    animation:beat 1.7s ease-in-out infinite;
    transform-origin:center;
    will-change:transform, opacity;
  }
  @keyframes beat {
    0%, 28%, 100% { transform:scale(1); }
    14%           { transform:scale(1.09); }
    21%           { transform:scale(1.03); }
  }

  #heartScreen:active #heart { transform:scale(.94); transition:transform .12s ease; animation:none; }

  .hint {
    font-size:14px; letter-spacing:.09em; text-transform:uppercase;
    color:rgba(255,255,255,.42); font-weight:500;
    animation:hintPulse 2.8s ease-in-out infinite;
  }
  @keyframes hintPulse { 0%,100%{opacity:.45;} 50%{opacity:.95;} }

  /* the tap: heart swells and dissolves */
  #heartScreen.opening .heart-wrap { animation:none; }
  #heartScreen.opening #heart {
    animation:none;
    transform:scale(1.85);
    opacity:0;
    filter:drop-shadow(0 0 70px rgba(255,45,105,.9));
    transition:transform 1s cubic-bezier(.22,.9,.3,1), opacity .85s ease-out .1s, filter .5s ease-out;
  }
  #heartScreen.opening .hint { opacity:0; transition:opacity .3s ease; }

  /* little hearts that float off on tap */
  .spark {
    position:absolute; top:50%; left:50%;
    font-size:20px; pointer-events:none;
    opacity:0; will-change:transform, opacity;
  }
  @keyframes sparkUp {
    0%   { opacity:0; transform:translate(-50%,-50%) scale(.4); }
    18%  { opacity:.95; }
    100% { opacity:0; transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1); }
  }

  /* ---------- MESSAGE SCREEN ---------- */
  #messageScreen {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    opacity:0; pointer-events:none;
    transform:translateY(18px);
  }
  #messageScreen.show {
    opacity:1; pointer-events:auto; transform:translateY(0);
    transition:opacity .9s ease .15s, transform 1s cubic-bezier(.22,.9,.3,1) .15s;
  }

  #date {
    font-size:12px; letter-spacing:.16em; text-transform:uppercase;
    color:rgba(255,255,255,.38); font-weight:600;
  }

  #message {
    font-family:"New York", Georgia, "Times New Roman", serif;
    font-size:clamp(23px, 6.2vw, 34px);
    line-height:1.45;
    text-align:center;
    color:#fff;
    text-shadow:0 2px 30px rgba(255,60,120,.3);
    max-height:62vh; overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  #message::-webkit-scrollbar { display:none; }

  #signoff {
    font-size:15px; color:rgba(255,255,255,.5); font-style:italic;
  }

  .mini-heart {
    margin-top:6px; font-size:22px; opacity:.55;
    animation:beat 1.7s ease-in-out infinite;
    cursor:pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; }
  }
</style>
</head>
<body>

<div class="glow"></div>

<div id="stage">

  <div id="heartScreen">
    <div class="heart-wrap">
      <svg id="heart" viewBox="0 0 100 92" xmlns="http://www.w3.org/2000/svg" aria-label="heart">
        <defs>
          <linearGradient id="hg" x1="0" y1="0" x2="0.4" y2="1">
            <stop offset="0%"   stop-color="#ff7ea8"/>
            <stop offset="45%"  stop-color="#ff2d69"/>
            <stop offset="100%" stop-color="#c8104a"/>
          </linearGradient>
          <radialGradient id="shine" cx="0.33" cy="0.26" r="0.4">
            <stop offset="0%"   stop-color="#fff" stop-opacity=".55"/>
            <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <path fill="url(#hg)" d="M50 91.5S4 61.4 4 30.6C4 14.6 15.9 3 30.6 3 39.6 3 46.6 7.6 50 13.9 53.4 7.6 60.4 3 69.4 3 84.1 3 96 14.6 96 30.6 96 61.4 50 91.5 50 91.5z"/>
        <path fill="url(#shine)" d="M50 91.5S4 61.4 4 30.6C4 14.6 15.9 3 30.6 3 39.6 3 46.6 7.6 50 13.9 53.4 7.6 60.4 3 69.4 3 84.1 3 96 14.6 96 30.6 96 61.4 50 91.5 50 91.5z"/>
      </svg>
    </div>
    <div class="hint">tap the heart</div>
  </div>

  <div id="messageScreen">
    <div id="date"></div>
    <div id="message"></div>
    <div id="signoff"></div>
    <div class="mini-heart" id="replay">♥</div>
  </div>

</div>

<script>
(function () {
  const heartScreen = document.getElementById('heartScreen');
  const msgScreen   = document.getElementById('messageScreen');
  const msgEl       = document.getElementById('message');
  const dateEl      = document.getElementById('date');
  const signEl      = document.getElementById('signoff');
  const stage       = document.getElementById('stage');

  let data = null;

  // --- local date as YYYY-MM-DD (no UTC drift) ---
  function todayKey() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function prettyDate() {
    return new Date().toLocaleDateString(undefined, {
      weekday: 'long', month: 'long', day: 'numeric'
    });
  }

  // Pick today's message. If there isn't one for today,
  // fall back to the most recent past-dated message (yesterday's stays up).
  function pickMessage(d) {
    const today = todayKey();
    const list = (d.messages || [])
      .filter(m => m && m.date && m.text)
      .sort((a, b) => a.date.localeCompare(b.date));

    const exact = list.find(m => m.date === today);
    if (exact) return exact.text;

    const past = list.filter(m => m.date <= today);
    if (past.length) return past[past.length - 1].text;

    return d.fallback || 'Thinking about you. ♥';
  }

  async function load() {
    try {
      // cache-bust so iOS never shows a stale message
      const res = await fetch('messages.json?t=' + Date.now(), { cache: 'no-store' });
      data = await res.json();
    } catch (e) {
      data = { fallback: 'Thinking about you. ♥', signoff: '', messages: [] };
    }
  }

  function sparkle() {
    const hearts = ['♥', '♡', '♥', '❥', '♥'];
    for (let i = 0; i < 12; i++) {
      const s = document.createElement('div');
      s.className = 'spark';
      s.textContent = hearts[i % hearts.length];
      const angle = (Math.PI * 2 * i) / 12 + Math.random() * 0.5;
      const dist  = 90 + Math.random() * 130;
      s.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      s.style.setProperty('--dy', (Math.sin(angle) * dist - 60) + 'px');
      s.style.color = i % 2 ? '#ff7ea8' : '#ff2d69';
      s.style.fontSize = (14 + Math.random() * 16) + 'px';
      s.style.animation = `sparkUp ${1 + Math.random() * 0.7}s cubic-bezier(.2,.7,.3,1) ${Math.random() * 0.18}s forwards`;
      stage.appendChild(s);
      setTimeout(() => s.remove(), 2200);
    }
  }

  let opened = false;
  function open() {
    if (opened) return;
    opened = true;

    if (navigator.vibrate) navigator.vibrate(12);

    heartScreen.classList.add('opening');
    sparkle();

    msgEl.textContent  = pickMessage(data);
    dateEl.textContent = prettyDate();
    signEl.textContent = data.signoff || '';

    setTimeout(() => {
      heartScreen.classList.add('gone');
      heartScreen.style.display = 'none';
      msgScreen.classList.add('show');
    }, 620);
  }

  function reset() {
    opened = false;
    msgScreen.classList.remove('show');
    heartScreen.style.display = '';
    heartScreen.classList.remove('opening', 'gone');
  }

  heartScreen.addEventListener('click', open);
  document.getElementById('replay').addEventListener('click', reset);

  // if she leaves the app open overnight, refresh on return
  document.addEventListener('visibilitychange', async () => {
    if (!document.hidden) {
      await load();
      if (opened) {
        msgEl.textContent  = pickMessage(data);
        dateEl.textContent = prettyDate();
      }
    }
  });

  load();
})();
</script>
</body>
</html>
